      var q = location.href.split('?')[0];
      location.replace(q + '?v=' + __VER);
    } else if(!vv){
      localStorage.setItem(vk, __VER);
    }
  }catch(e){}
  try{
    var tabs = document.querySelectorAll('.tab');
    var frames = {chip: document.getElementById('frame-chip'), tf: document.getElementById('frame-tf')};
    function show(name){
      for(var k in frames){ if(frames[k]) frames[k].className = 'frame' + (k === name ? ' on' : ''); }
      for(var i = 0; i < tabs.length; i++){
        tabs[i].className = 'tab' + (tabs[i].getAttribute('data-tab') === name ? ' active' : '');
      }
    }
    for(var i = 0; i < tabs.length; i++){
      (function(t){
        t.addEventListener('click', function(){ show(t.getAttribute('data-tab')); });
      })(tabs[i]);
    }
    var cc = document.getElementById('clearCache');
    var toast = document.getElementById('ccToast');
    if(cc){
      cc.addEventListener('click', function(){
        try{
          if(window.caches && caches.keys){
            caches.keys().then(function(ks){
              return Promise.all(ks.map(function(k){ return caches.delete(k); }));
            }).catch(function(){});
          }
        }catch(e){}
        if(toast){ toast.style.opacity = 1; }
        setTimeout(function(){
          var q = location.href.split('?')[0];
          location.replace(q + (q.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now());
        }, 400);
      });
    }
  }catch(e){ if(window.console) console.error(e); }
})();
</script>
</html>
